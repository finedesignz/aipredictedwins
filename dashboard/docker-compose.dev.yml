version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: python-base  # not used — raw uvicorn for dev
    image: python:3.13-slim
    working_dir: /app/api
    command: >
      bash -c "pip install -r requirements.txt &&
               uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ../data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data

  web:
    image: node:22-slim
    working_dir: /app/web
    command: >
      bash -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app/web
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
