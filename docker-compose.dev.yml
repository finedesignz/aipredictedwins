version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aipw
      POSTGRES_USER: aipw
      POSTGRES_PASSWORD: aipw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipw"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot-a:
    build:
      context: .
      dockerfile: Dockerfile.alpaca
    environment:
      BOT_ID: "A"
      DATABASE_URL: postgresql://aipw:aipw@postgres:5432/aipw
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  bot-b:
    build:
      context: .
      dockerfile: Dockerfile.alpaca
    environment:
      BOT_ID: "B"
      DATABASE_URL: postgresql://aipw:aipw@postgres:5432/aipw
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: dashboard
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://aipw:aipw@postgres:5432/aipw
      PYTHONUNBUFFERED: "1"
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - ./dashboard/web:/app/web
      - ./dashboard/api:/app/api
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
