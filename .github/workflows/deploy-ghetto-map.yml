name: Deploy Warsaw Ghetto map to Cloudflare Pages

# Deploys the static site in warsaw-ghetto-map/ to Cloudflare Pages.
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN  - token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID - your Cloudflare account ID
# GitHub's runners can reach the Cloudflare API (unlike the dev sandbox),
# so the deploy happens here and the live *.pages.dev URL is printed in the
# job summary / step output.

on:
  push:
    branches:
      - main
      - claude/warsaw-ghetto-wall-map-9456cu
    paths:
      - 'warsaw-ghetto-map/**'
      - '.github/workflows/deploy-ghetto-map.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip cleanly (no red X) if secrets aren't configured yet.
    if: ${{ github.event_name == 'workflow_dispatch' || true }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy warsaw-ghetto-map
            --project-name=warsaw-ghetto-wall
            --branch=${{ github.ref_name }}
            --commit-dirty=true
